packages:
  - apps/*
  - packages/*

# Install scripts: esbuild and lefthook only pick their platform binary; the others are optional steps the app
# does not need.
allowBuilds:
  esbuild: true
  lefthook: true
  '@firebase/util': false
  protobufjs: false

minimumReleaseAgeExclude:
  - lucide-react@1.59.0
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'

# Security fixes for transitive dependencies (pnpm audit --prod).
overrides:
  '@grpc/grpc-js': 1.14.6
